# sqlc generates type-safe query code from the shared schema
# (internal/store/migrations) and the queries (internal/store/queries, one
# file per table or area) into one package, internal/store/storedb, used by
# the skills' <skill>store packages. Run make sqlc after changing SQL; CI
# fails if the generated code is out of date.
version: "2"
sql:
  - engine: sqlite
    schema: internal/store/migrations
    queries: internal/store/queries
    gen:
      go:
        package: storedb
        out: internal/store/storedb
