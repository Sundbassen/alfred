name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The job id is the required status check on main; rename it there too.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Native dependency versions
        id: deps
        run: |
          echo "whisper=$(sed -n 's/^WHISPER_REF := //p' Makefile)" >> "$GITHUB_OUTPUT"
          echo "ort=$(sed -n 's/^ONNXRUNTIME_VERSION := //p' Makefile)" >> "$GITHUB_OUTPUT"
          echo "llama=$(sed -n 's/^LLAMA_REF := //p' Makefile)" >> "$GITHUB_OUTPUT"

      - name: Cache whisper.cpp and ONNX Runtime
        uses: actions/cache@v4
        with:
          path: backend/.deps
          key: native-${{ runner.os }}-whisper-${{ steps.deps.outputs.whisper }}-ort-${{ steps.deps.outputs.ort }}-llama-${{ steps.deps.outputs.llama }}

      # Portable build: a cached -march=native build could crash on a runner
      # with a different CPU.
      - name: Install whisper.cpp and ONNX Runtime
        run: make install WHISPER_CMAKE_FLAGS=-DGGML_NATIVE=OFF

      # Only our packages: go list skips dot directories such as .deps,
      # which holds whisper.cpp's own Go bindings.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(go list -f '{{.Dir}}' ./...))"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi

      - run: make vet

      # cmd -> anything, skills -> internal, internal -> internal only
      - run: make layers

      # Tests that need downloaded models (wake word, Silero VAD) skip in CI.
      - run: make test

      - run: make build

      - name: Training script compiles
        working-directory: .
        run: python3 -m py_compile trainwakeword/train-wakeword.py
